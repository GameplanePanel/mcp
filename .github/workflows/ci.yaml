# CI: the shared Gameplane workflow for split components (lint with Gameplane's
# .golangci.yml and .hadolint.yaml, race tests on amd64 and arm64 with the
# .testcoverage.yml gate, govulncheck, image build). Pinned by SHA.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, so govulncheck sees new advisories
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: GameplanePanel/Gameplane/.github/workflows/go-component.yaml@a9195f596eb0d36776767b691bbdd8f5962fa394 # master
    with:
      # This repo is the mcp-server/ submodule in Gameplane; the Dockerfile copies mcp-server/...
      path: mcp-server
